description = 'A module containing spring-boot autoconfiguration classes for persisting xfcd data deliveries with postgres'

sourceSets {
    main {
        resources {
            srcDirs 'src/main/resources',
                    '../xfcd-consumer-postgres/src/main/resources'
        }
    }
}

dependencies {
    implementation project(':xfcd-consumer-jdbc-spring-boot-starter')
    implementation project(':xfcd-consumer-postgres')

    implementation group: 'org.postgresql', name: 'postgresql', version: '42.2.4'

    testImplementation("org.amv.trafficsoft:amv-trafficsoft-rest-model-test:${trafficsoftRestVersion}")
    testImplementation "org.amv.vertx:amv-vertx-spring-boot-starter:${amvVertxVersion}"

    testImplementation group: 'org.postgresql', name: 'postgresql', version: '42.2.4'
    testImplementation 'com.opentable.components:otj-pg-embedded:0.12.5'
}
