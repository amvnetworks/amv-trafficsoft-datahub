description = 'A module containing core classes for consuming xfcd data deliveries'

dependencies {
    implementation project(':xfcd')
    implementation "io.vertx:vertx-web:${vertxVersion}"
    implementation "io.vertx:vertx-rx-java3:${vertxVersion}"
    implementation "org.amv.trafficsoft:amv-trafficsoft-rest-model:${trafficsoftRestVersion}"
    // Needed to resolve Jackson annotations used by the REST model (e.g., JsonInclude)
    implementation "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"
}
