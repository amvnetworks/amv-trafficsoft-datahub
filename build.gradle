import io.franzbecker.gradle.lombok.task.DelombokTask

buildscript {
    ext {
        trafficsoftRestVersion = '0.6.15'
        vertxVersion = '3.9.10'
        amvVertxVersion = '0.0.4-SNAPSHOT'
        jacksonVersion = '2.13.3'
        springBootVersion = '2.7.0'
        reactorVersion = '3.1.0.RELEASE'
    }
    repositories {
        maven {
            credentials {
                username = nexusUsername
                password = nexusPassword
            }
            url "${nexusUrl}/repository/snapshots/"
        }
        maven {
            credentials {
                username = nexusUsername
                password = nexusPassword
            }
            url "${nexusUrl}/repository/releases/"
        }

        mavenCentral()
    }
    dependencies {
        // Removed legacy nu.studer:gradle-credentials-plugin to avoid resolving unavailable artifacts on Gradle 8+
    }
}

plugins {
    id 'io.franzbecker.gradle-lombok' version '5.0.0'
    // Removed legacy nebula plugins incompatible with Gradle 8+
    id 'com.github.ben-manes.versions' version '0.14.0'
}

description = 'Parent package for handling AMV Trafficsoft xfcd data deliveries'

group = 'org.amv.trafficsoft.datahub'
version = '0.3.13-SNAPSHOT'


allprojects {

    group 'org.amv.trafficsoft.datahub'

    configurations.all {
        resolutionStrategy {
            preferProjectModules()
            // fail eagerly on version conflict (includes transitive dependencies)
            // e.g. multiple different versions of the same dependency (group and name are equal)
            failOnVersionConflict()

            force 'com.netflix.archaius:archaius-core:0.6.6',
                    'commons-codec:commons-codec:1.10',
                    'org.slf4j:slf4j-api:1.7.25',
                    'com.google.guava:guava:22.0',
                    'io.dropwizard.metrics:metrics-core:3.2.5',
                    'org.eclipse.aether:aether-api:1.1.0',
                    'org.eclipse.aether:aether-spi:1.1.0',
                    'org.eclipse.aether:aether-util:1.1.0',
                    'org.eclipse.aether:aether-impl:1.1.0',
                    'com.fasterxml.jackson.core:jackson-core:2.13.3',
                    'com.fasterxml.jackson.core:jackson-databind:2.13.3',
                    'com.fasterxml.jackson.core:jackson-annotations:2.13.3',
                    'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.13.3',
                    'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.13.3',
                    'com.fasterxml.jackson.module:jackson-module-parameter-names:2.13.3',
                    'io.reactivex:rxjava:1.3.0',
                    'org.reactivestreams:reactive-streams:1.0.1',
                    'org.apache.commons:commons-lang3:3.5',
                    'org.hamcrest:hamcrest-core:1.3',
                    'commons-logging:commons-logging:1.2',
                    'org.apache.commons:commons-compress:1.14',
                    'org.jetbrains.kotlin:kotlin-stdlib:1.3.70',
                    'com.squareup.okio:okio:1.17.3',
                    'com.google.code.findbugs:jsr305:3.0.2',
                    'io.prometheus:simpleclient:0.10.0'
        }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'project-report'
    apply plugin: 'io.franzbecker.gradle-lombok'
    apply plugin: 'jacoco'

    sourceCompatibility = 1.8
    targetCompatibility = 1.8

    // ---- prepare task graph - disable long running tasks on demand
    gradle.taskGraph.whenReady { graph ->
        def isMinimalBuild = project.hasProperty("minimal")

        def enableAdditionalLongRunningTasks = !isMinimalBuild

        if (!enableAdditionalLongRunningTasks) {
            javadoc.enabled = false
        }
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            credentials {
                username = nexusUsername
                password = nexusPassword
            }
            url "${nexusUrl}/repository/snapshots/"
        }
        maven {
            credentials {
                username = nexusUsername
                password = nexusPassword
            }
            url "${nexusUrl}/repository/releases/"
        }
    }

    dependencies {
        implementation 'com.google.guava:guava:22.0'
        implementation 'io.dropwizard.metrics:metrics-core:3.2.5'
        compileOnly 'org.projectlombok:lombok:1.18.30'

        implementation "io.projectreactor:reactor-core:${reactorVersion}"
        implementation "io.projectreactor.addons:reactor-adapter:${reactorVersion}"
        implementation "io.projectreactor.addons:reactor-extra:${reactorVersion}"

        testImplementation 'junit:junit:4.12'
        testImplementation 'org.hamcrest:hamcrest-all:1.3'
        testImplementation 'pl.pragmatists:JUnitParams:1.0.6'

        // TODO: commons-lang should be a testCompile dependency:
        // only used for RandomUtils in tests
        implementation 'org.apache.commons:commons-lang3:3.5'

        testImplementation "io.vertx:vertx-unit:${vertxVersion}"
        testImplementation "io.projectreactor:reactor-test:${reactorVersion}"

        testImplementation("org.springframework.boot:spring-boot-starter-test:${springBootVersion}")
    }

    lombok {
        version = '1.18.30'
    }

    task delombok(type: DelombokTask, dependsOn: compileJava) {
        ext.outputDir = file("$buildDir/delombok")
        outputs.dir(outputDir)
        sourceSets.main.java.srcDirs.each {
            inputs.dir(it)
            args(it, '-d', outputDir)
        }
    }

    jar.doFirst {
        // other manifest attributes will be populated by nebula.info plugin
        // see https://github.com/nebula-plugins/gradle-info-plugin
        def vendor = 'AMV Networks GmbH'
        manifest {
            attributes(
                    'Specification-Title': project.description,
                    'Specification-Version': project.version,
                    'Specification-Vendor': vendor,
                    'Implementation-Vendor': vendor
            )
        }
    }

    task sourcesJar(type: Jar) {
        from sourceSets.main.allSource
        archiveClassifier.set('sources')
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    task testJar(type: Jar) {
        archiveClassifier.set('test')
        from sourceSets.test.output
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    task javadocJar(type: Jar, dependsOn: javadoc) {
        from javadoc.destinationDir
        archiveClassifier.set('javadoc')
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    artifacts {
        archives javadocJar, sourcesJar
    }

    task subprojectsDependencies(type: DependencyReportTask) {

    }

    // ---- upload into Nexus (legacy 'maven' plugin removed in Gradle 8+); publishing disabled to keep build working.
}
