import io.franzbecker.gradle.lombok.task.DelombokTask

buildscript {
    ext {
        trafficsoftRestVersion = '20251020.2'
        vertxVersion = '4.5.10'
        amvVertxVersion = '20251020.1'
        jacksonVersion = '2.17.2'
        springBootVersion = '3.3.4'
        reactorVersion = '3.6.10'
    }
    repositories {
        mavenCentral()
        maven {
            name = 'trafficsoft'
            url = uri('https://pkgs.dev.azure.com/autologg/_packaging/trafficsoft/maven/v1')
            credentials {
                username = 'autologg'
                def localPat = System.getenv('PAT')
                if(localPat == null || localPat.trim().isEmpty()) {
                    // Read local override from untracked gradle.properties (local.pat) or fallback env var
                    localPat = project.findProperty('local.pat') ?: localPat
                }
                password = localPat
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
    dependencies {
        // Removed legacy nu.studer:gradle-credentials-plugin to avoid resolving unavailable artifacts on Gradle 8+
    }
}

plugins {
    id 'io.franzbecker.gradle-lombok' version '5.0.0'
    // Removed legacy nebula plugins incompatible with Gradle 8+
    id 'com.github.ben-manes.versions' version '0.14.0'
}

description = 'Parent package for handling AMV Trafficsoft xfcd data deliveries'

if (!project.hasProperty('version') || project.version == 'unspecified') {
    version = System.getenv('BUILD_VERSION') ?: rootProject.version
}


allprojects {

    group 'org.amv.trafficsoft.datahub'

    if (!project.hasProperty('version') || project.version == 'unspecified') {
        version = System.getenv('BUILD_VERSION') ?: rootProject.version
    }

    configurations.all {
        resolutionStrategy {
            preferProjectModules()
            // fail eagerly on version conflict (includes transitive dependencies)
            // e.g. multiple different versions of the same dependency (group and name are equal)
            // failOnVersionConflict()  // disabled to allow constraints to select versions instead of failing

            // force removed to allow Spring Boot 3.x dependency management to control versions
        }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'project-report'
    apply plugin: 'io.franzbecker.gradle-lombok'
    apply plugin: 'jacoco'
    apply plugin: 'maven-publish'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    // ---- prepare task graph - disable long running tasks on demand
    gradle.taskGraph.whenReady { graph ->
        def isMinimalBuild = project.hasProperty("minimal")

        def enableAdditionalLongRunningTasks = !isMinimalBuild

        if (!enableAdditionalLongRunningTasks) {
            javadoc.enabled = false
        }
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            name = 'trafficsoft'
            url = uri('https://pkgs.dev.azure.com/autologg/_packaging/trafficsoft/maven/v1')
            credentials {
                username = 'autologg'
                def localPat = System.getenv('PAT')
                if(localPat == null || localPat.trim().isEmpty()) {
                    localPat = project.findProperty('local.pat') ?: localPat
                }
                password = localPat
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }

    dependencies {
        implementation 'com.google.guava:guava:22.0'
        implementation 'io.dropwizard.metrics:metrics-core:4.2.37'
        compileOnly 'org.projectlombok:lombok:1.18.34'

        constraints {
            implementation('org.slf4j:slf4j-api:2.0.16') {
                because 'Align all modules to SLF4J 2.0.x to match Spring Boot 3.x starter-logging and avoid version conflicts with legacy transitive 1.7.x (e.g., metrics-core)'
            }
        }

        implementation "io.projectreactor:reactor-core:${reactorVersion}"
        implementation("io.projectreactor.addons:reactor-adapter:3.5.1") {
            because 'Use addons 3.5.1 but align core to 3.6.10; exclude transitive reactor-core to avoid version conflicts'
            exclude group: 'io.projectreactor', module: 'reactor-core'
        }
        implementation("io.projectreactor.addons:reactor-extra:3.5.1") {
            because 'Use addons 3.5.1 but align core to 3.6.10; exclude transitive reactor-core to avoid version conflicts'
            exclude group: 'io.projectreactor', module: 'reactor-core'
        }

        constraints {
            implementation('org.reactivestreams:reactive-streams:1.0.4') {
                because 'Resolve conflict between 1.0.3 and 1.0.4 pulled transitively; align to 1.0.4 required by reactor-core 3.6.10'
            }
        }

        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.hamcrest:hamcrest-all:1.3'
        testImplementation 'pl.pragmatists:JUnitParams:1.0.6'
        testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.10.3'

        // TODO: commons-lang should be a testCompile dependency:
        // only used for RandomUtils in tests
        implementation 'org.apache.commons:commons-lang3:3.5'

        testImplementation "io.vertx:vertx-unit:${vertxVersion}"
        testImplementation "io.projectreactor:reactor-test:${reactorVersion}"

        testImplementation("org.springframework.boot:spring-boot-starter-test:${springBootVersion}")
    }

    lombok {
        version = '1.18.34'
    }

    task delombok(type: DelombokTask, dependsOn: compileJava) {
        ext.outputDir = file("$buildDir/delombok")
        outputs.dir(outputDir)
        sourceSets.main.java.srcDirs.each {
            inputs.dir(it)
            args(it, '-d', outputDir)
        }
    }

    jar.doFirst {
        // other manifest attributes will be populated by nebula.info plugin
        // see https://github.com/nebula-plugins/gradle-info-plugin
        def vendor = 'AMV Networks GmbH'
        manifest {
            attributes(
                    'Specification-Title': project.description,
                    'Specification-Version': project.version,
                    'Specification-Vendor': vendor,
                    'Implementation-Vendor': vendor
            )
        }
    }

    task sourcesJar(type: Jar) {
        from sourceSets.main.allSource
        archiveClassifier.set('sources')
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    task testJar(type: Jar) {
        archiveClassifier.set('test')
        from sourceSets.test.output
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    task javadocJar(type: Jar, dependsOn: javadoc) {
        from javadoc.destinationDir
        archiveClassifier.set('javadoc')
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    artifacts {
        archives javadocJar, sourcesJar
    }

    task subprojectsDependencies(type: DependencyReportTask) {

    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                artifact sourcesJar
                artifact javadocJar
                groupId = project.group
                artifactId = project.name
                version = project.version
            }
        }
        repositories {
            maven {
                name = 'trafficsoft'
                url = uri('https://pkgs.dev.azure.com/autologg/_packaging/trafficsoft/maven/v1')
                credentials {
                    username = 'autologg'
                    def localPat = System.getenv('PAT')
                    if(localPat == null || localPat.trim().isEmpty()) {
                        localPat = project.findProperty('local.pat') ?: localPat
                    }
                    password = localPat
                }
                authentication {
                    basic(BasicAuthentication)
                }
            }
        }
    }
}
