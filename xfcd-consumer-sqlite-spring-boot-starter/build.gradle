description = 'A module containing spring-boot autoconfiguration classes for persisting xfcd data deliveries with sqlite'

sourceSets {
    main {
        resources {
            srcDirs 'src/main/resources',
                    '../xfcd-consumer-sqlite/src/main/resources'
        }
    }
}

// Allow duplicate resource entries like META-INF/spring.factories to be merged during resource processing
tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

dependencies {
    implementation project(':xfcd-consumer-sqlite')
    implementation project(':xfcd-consumer-jdbc-spring-boot-starter')
    implementation project(':xfcd-consumer-jdbc')

    // Spring Boot autoconfigure and JDBC APIs used by auto-config class
    implementation "org.springframework.boot:spring-boot-autoconfigure:${springBootVersion}"
    implementation "org.springframework.boot:spring-boot-starter-jdbc:${springBootVersion}"

    // SQLite JDBC driver
    implementation 'org.xerial:sqlite-jdbc:3.36.0.3'

    testImplementation("org.amv.trafficsoft:amv-trafficsoft-rest-model-test:${trafficsoftRestVersion}")
    testImplementation "org.amv.vertx:amv-vertx-spring-boot-starter:${amvVertxVersion}"
    // Access core Xfcd types (XfcdEvents, events) needed by tests
    testImplementation project(':xfcd')

    testImplementation 'org.xerial:sqlite-jdbc:3.36.0.3'
}
