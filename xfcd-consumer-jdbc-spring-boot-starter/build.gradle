description = 'A module containing spring-boot autoconfiguration classes for persisting xfcd data deliveries via jdbc'

dependencies {
    implementation project(':xfcd-consumer-jdbc')

    testImplementation project(':xfcd-spring-boot-autoconfigure')
    testImplementation "org.amv.vertx:amv-vertx-spring-boot-starter:${amvVertxVersion}"

    testImplementation 'org.xerial:sqlite-jdbc:3.36.0.3'
}
