description = 'A module containing test classes for persisting xfcd data deliveries via jdbc'

dependencies {
    implementation project(':xfcd-consumer-jdbc')

    implementation("org.springframework.boot:spring-boot-starter-test:${springBootVersion}")
    implementation 'junit:junit:4.12'
    implementation 'org.hamcrest:hamcrest-all:1.3'
    implementation 'pl.pragmatists:JUnitParams:1.0.6'

    testImplementation ('org.dbunit:dbunit:2.6.0') {
        // postgresql:postgresql:8.4-701.jdbc3 pulls in wrong driver version
        exclude group: 'postgresql', module: 'postgresql'
    }
    implementation 'com.github.springtestdbunit:spring-test-dbunit:1.3.0'
}
