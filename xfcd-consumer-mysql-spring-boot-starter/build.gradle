description = 'A module containing spring-boot autoconfiguration classes for persisting xfcd data deliveries with mysql'

sourceSets {
    main {
        resources {
            srcDirs 'src/main/resources',
                    '../xfcd-consumer-mysql/src/main/resources'
        }
    }
}

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

dependencies {
    implementation project(':xfcd-consumer-jdbc-spring-boot-starter')
    implementation project(':xfcd-consumer-mysql')
    implementation project(':xfcd-consumer-jdbc')

    // Spring Boot autoconfigure and JDBC APIs used by auto-config class
    implementation "org.springframework.boot:spring-boot-autoconfigure:${springBootVersion}"
    implementation "org.springframework.boot:spring-boot-starter-jdbc:${springBootVersion}"

    implementation 'com.mysql:mysql-connector-j:8.4.0'

    testImplementation project(':xfcd')
    // Include model classes and test mothers
    testImplementation("org.amv.trafficsoft:amv-trafficsoft-rest-model:${trafficsoftRestVersion}")
    testImplementation("org.amv.trafficsoft:amv-trafficsoft-rest-model-test:${trafficsoftRestVersion}")
    // Removed amv-vertx starter (built for Vert.x 3) from test classpath to avoid incompatibility with Vert.x 4
    // testImplementation "org.amv.vertx:amv-vertx-spring-boot-starter:${amvVertxVersion}"

    testImplementation 'com.mysql:mysql-connector-j:8.4.0'
    testImplementation 'org.testcontainers:mysql:1.20.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
}
