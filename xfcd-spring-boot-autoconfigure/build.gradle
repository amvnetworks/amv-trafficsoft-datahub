description = 'A module containing spring-boot autoconfiguration classes for handling xfcd data deliveries'

dependencies {
    implementation project(':xfcd')
    implementation "io.vertx:vertx-core:${vertxVersion}"
    implementation "org.springframework.boot:spring-boot-autoconfigure:${springBootVersion}"
    implementation "org.amv.trafficsoft:amv-trafficsoft-rest-client-spring-boot-starter:${trafficsoftRestVersion}"

    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor:${springBootVersion}"

    testImplementation "io.vertx:vertx-unit:${vertxVersion}"
    testImplementation "org.amv.vertx:amv-vertx-spring-boot-starter:${amvVertxVersion}"
}
