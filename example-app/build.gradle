description = 'A demo application using the trafficsoft datahub module'

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}"
    }
}

apply plugin: 'org.springframework.boot'

configurations.all {
    resolutionStrategy {
        preferProjectModules()
        // Inherit parent strategy (no failOnVersionConflict) to allow BOMs/constraints to align versions
        // Remove strict conflict checks that cause build to fail on benign version differences in tests
        // failOnVersionConflict()
        // Do not force SLF4J here; parent already constrains it

        dependencySubstitution {
            // Allow Spring Boot 3.x to manage versions; keep SQLite fixed if needed
            substitute module('org.xerial:sqlite-jdbc') using module('org.xerial:sqlite-jdbc:3.45.3.0')
        }
    }
}

dependencies {
    implementation project(':xfcd-spring-boot-starter')
    implementation project(':xfcd-demo-spring-boot-starter')
    // Ensure DAO API is available at compile time
    implementation project(':xfcd-consumer-jdbc')

    implementation("org.springframework.boot:spring-boot-starter:${springBootVersion}")
    implementation("org.springframework.boot:spring-boot-starter-web:${springBootVersion}")

    // Use Boot starter to provide spring-jdbc and spring-tx with managed versions
    testImplementation("org.springframework.boot:spring-boot-starter-jdbc:${springBootVersion}")
    //implementation("org.springframework.boot:spring-boot-starter-jetty:${springBootVersion}")
}


bootRun {
    systemProperties = project.gradle.startParameter.systemPropertiesArgs
    sourceResources sourceSets.main
}

springBoot {
}
