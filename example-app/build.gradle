description = 'A demo application using the trafficsoft datahub module'

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}"
    }
}

apply plugin: 'org.springframework.boot'

configurations.all {
    resolutionStrategy {
        preferProjectModules()
        failOnVersionConflict()

        dependencySubstitution {
            // necessary as spring-boot plugin pulls in old versions
            // see https://discuss.gradle.org/t/excluded-dependence-comes-back-when-spring-boot-plugin-is-applied/17945/2
            substitute module('com.zaxxer:HikariCP') using module('com.zaxxer:HikariCP:4.0.3')
            substitute module('org.flywaydb:flyway-core') using module('org.flywaydb:flyway-core:7.15.0')
            substitute module('org.xerial:sqlite-jdbc') using module('org.xerial:sqlite-jdbc:3.19.3')
        }
    }
}

dependencies {
    implementation project(':xfcd-spring-boot-starter')
    implementation project(':xfcd-demo-spring-boot-starter')

    implementation("org.springframework.boot:spring-boot-starter:${springBootVersion}")
    implementation("org.springframework.boot:spring-boot-starter-web:${springBootVersion}")
    //implementation("org.springframework.boot:spring-boot-starter-jetty:${springBootVersion}")
}


bootRun {
    systemProperties = project.gradle.startParameter.systemPropertiesArgs
    sourceResources sourceSets.main
}

springBoot {
}
